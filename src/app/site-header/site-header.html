<header class="header">
  <a class="brand" href="#inicio" (click)="go($event, 'inicio')" aria-label="Ir al inicio">
    <img src="img/logo-night-3.png" alt="" width="66" height="42" />
    <span>{{ site.shortName }}</span>
  </a>

  <button
    class="toggle"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="main-nav"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="menuOpen.set(!menuOpen())"
  >
    <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
  </button>

  <nav id="main-nav" class="nav" [class.nav--open]="menuOpen()" aria-label="Secciones">
    @for (link of links; track link.id) {
      <a [href]="'#' + link.id" (click)="go($event, link.id)">{{ link.label }}</a>
    }
  </nav>
</header>
